name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Download 3D engine into the app
        run: curl -L -o app/src/main/assets/three.js https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WebSlinger-APK
          path: app/build/outputs/apk/debug/app-debug.apk
